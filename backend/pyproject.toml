[project]
name = "ic-verify-backend"
version = "1.0.0"
description = "FastAPI backend for IC Verify AI"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.9",
    "numpy>=1.24.0",
    "opencv-python-headless>=4.8.0.76",
    "requests>=2.31.0",
]

[tool.vercel]
entrypoint = "main:app"
